name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/app/SimpleMarkdown.csproj | head -1)"
          if ! [[ "$version" =~ ^[0-9]+$ ]]; then
            echo "::error::<Version> in src/app/SimpleMarkdown.csproj must be a whole number, found '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Release v${{ steps.version.outputs.version }} already exists. Increase <Version> in src/app/SimpleMarkdown.csproj."
            exit 1
          fi

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build packages
        run: ./packaging/build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            dist/*.rpm dist/*.tar.gz
